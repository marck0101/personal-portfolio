<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>OG Cover — marck0101.com.br</title>
  <!-- Capa 1200×630 no padrão "Relatório de campo" (docs/marca/BRAND.md).
       Gerar o PNG: chrome --headless=new --hide-scrollbars --window-size=1200,630
       --virtual-time-budget=5000 --screenshot=og-image.png <url deste arquivo> -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px; height: 630px; overflow: hidden;
      background: #F4F1EA; color: #1C2733;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
    }
    .canvas { width: 1200px; height: 630px; padding: 64px 72px; display: flex; gap: 64px; }
    .texto { flex: 1; display: flex; flex-direction: column; }
    .logo { display: flex; align-items: center; gap: 14px; }
    .simbolo { position: relative; width: 52px; height: 52px; border-radius: 9px; background: #1C2733;
      display: flex; align-items: center; justify-content: center; }
    .simbolo span.m { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 37px; line-height: 1;
      color: #F4F1EA; transform: translate(-6%, -6%); }
    .simbolo span.ponto { position: absolute; right: 7px; bottom: 10px; width: 9px; height: 9px; border-radius: 50%; background: #D9542B; }
    .marca { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 26px; }
    .rotulo { font-family: "IBM Plex Mono", monospace; font-size: 17px; color: #8A8578; letter-spacing: .02em; }
    .nome { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 66px; line-height: 1.08; margin-top: 46px; }
    .cargo { font-size: 27px; font-weight: 500; color: #3A4756; margin-top: 18px; }
    .assinatura { margin-top: auto; padding-top: 22px; border-top: 1px solid #1C2733;
      display: flex; justify-content: space-between; align-items: baseline; }
    .assinatura strong { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 28px; }
    .assinatura .url { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 18px; color: #D9542B; }
    figure { width: 330px; display: flex; flex-direction: column; gap: 12px; }
    figure img { width: 330px; height: 410px; object-fit: cover; border-radius: 8px; border: 1px solid #D8D2C4; background: #E9E4D8; }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="texto">
      <div class="logo">
        <div class="simbolo"><span class="m">m</span><span class="ponto"></span></div>
        <span class="marca">marck0101</span>
      </div>
      <h1 class="nome">Marcos Henrique Corrêa</h1>
      <p class="cargo">Programador full stack e gestor de tráfego</p>
      <p class="rotulo" style="margin-top:14px">Google Ads · Meta Ads · tracking · React · Node.js</p>
      <div class="assinatura">
        <strong>O básico, bem feito e medido.</strong>
        <span class="url">marck0101.com.br</span>
      </div>
    </div>
    <figure>
      <img src="/marcos-henrique-correa.webp" alt="" />
      <figcaption class="rotulo">fig. 01 · Santo Cristo, RS</figcaption>
    </figure>
  </div>
</body>
</html>
