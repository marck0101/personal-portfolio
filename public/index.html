    <!-- Tema aplicado antes da pintura, sem piscar (mesma regra de src/utils/tema.js):
         estilo em localStorage.skin (jornal = sempre claro, terminal = sempre escuro);
         no visual atual, localStorage.darkMode ou, sem preferência, o sistema. -->
    <script>
      ;(function () {
        var tema = 'relatorio'
        try {
          var skin = localStorage.getItem('skin')
          if (skin === 'jornal') tema = 'jornal'
          else if (skin === 'terminal') tema = 'bbs'
          else {
            var saved = localStorage.getItem('darkMode')
            var dark = saved === null
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
              : saved === 'true'
            if (dark) tema = 'relatorio-escuro'
          }
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', tema)
        document.documentElement.style.colorScheme =
          tema === 'bbs' || tema === 'relatorio-escuro' ? 'dark' : 'light'
      })()
    </script>
